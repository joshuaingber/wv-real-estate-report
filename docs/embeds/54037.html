<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jefferson County — WV Real Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
:root {
  --ground:#F3F5F8; --surface:#FFFFFF; --ink:#12213A; --ink-2:#34425A; --muted:#55617A;
  --rule:#D6DDE6; --rule-strong:#8E99AB;
  --heading:#002855; --link:#002855; --gold:#EEAA00; --gold-text:#7F6310;
  --neg:#8D4638; --pos:#1F6F3F; --focus:#002855;
  --band:#002855; --band-ink:#FFFFFF; --band-muted:#B8C7DB; --band-line:#2B4C77; --band-shape:#0D3A6B; --band-tick:#9FB4CF;
  --line:#002855; --area:rgba(0,40,85,.08); --sf:#002855; --mf:#EEAA00; --hatch:#A9B4C3; --hatch-bg:#EEF1F5;
  --sel-halo:#EEAA00; --sel-core:#12213A; --map-edge:#FFFFFF; --tip-bg:#12213A; --tip-ink:#FFFFFF;
  --s0:#E4EAF1; --s1:#C4D3E4; --s2:#95B3D2; --s3:#6190BF; --s4:#3169A3; --s5:#114782; --s6:#002855;
  --g0:#8D4638; --g1:#F1CF6B; --g2:#CAD7E7; --g3:#90AFD1; --g4:#5282B6; --g5:#215790; --g6:#002855;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --ground:#07111E; --surface:#0D1B2E; --ink:#E6EBF2; --ink-2:#C3CCD9; --muted:#97A4B7;
  --rule:#1D2E46; --rule-strong:#56667E;
  --heading:#E6EBF2; --link:#9CC2EA; --gold-text:#EEAA00; --neg:#E28B77; --pos:#6CC08E; --focus:#EEAA00;
  --band:#0A2140; --band-ink:#FFFFFF; --band-muted:#A9BAD0; --band-line:#223F66; --band-shape:#14375F; --band-tick:#8FA7C6;
  --line:#9CC2EA; --area:rgba(156,194,234,.12); --sf:#6E9FD6; --mf:#EEAA00; --hatch:#35465E; --hatch-bg:#0D1B2E;
  --sel-halo:#EEAA00; --sel-core:#FFFFFF; --map-edge:#07111E; --tip-bg:#E6EBF2; --tip-ink:#07111E;
  --s0:#17294A; --s1:#1F3B63; --s2:#2A5387; --s3:#3C6EA8; --s4:#5A90C8; --s5:#88B4DF; --s6:#C4DCF3;
  --g0:#D27561; --g1:#C9971F; --g2:#213A5C; --g3:#325A8C; --g4:#4C7EBA; --g5:#7AA9DC; --g6:#BDD8F3;
  }
}
:root[data-theme="dark"] {
  --ground:#07111E; --surface:#0D1B2E; --ink:#E6EBF2; --ink-2:#C3CCD9; --muted:#97A4B7;
  --rule:#1D2E46; --rule-strong:#56667E;
  --heading:#E6EBF2; --link:#9CC2EA; --gold-text:#EEAA00; --neg:#E28B77; --pos:#6CC08E; --focus:#EEAA00;
  --band:#0A2140; --band-ink:#FFFFFF; --band-muted:#A9BAD0; --band-line:#223F66; --band-shape:#14375F; --band-tick:#8FA7C6;
  --line:#9CC2EA; --area:rgba(156,194,234,.12); --sf:#6E9FD6; --mf:#EEAA00; --hatch:#35465E; --hatch-bg:#0D1B2E;
  --sel-halo:#EEAA00; --sel-core:#FFFFFF; --map-edge:#07111E; --tip-bg:#E6EBF2; --tip-ink:#07111E;
  --s0:#17294A; --s1:#1F3B63; --s2:#2A5387; --s3:#3C6EA8; --s4:#5A90C8; --s5:#88B4DF; --s6:#C4DCF3;
  --g0:#D27561; --g1:#C9971F; --g2:#213A5C; --g3:#325A8C; --g4:#4C7EBA; --g5:#7AA9DC; --g6:#BDD8F3;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55; }
.wrap { max-width:1240px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); }
a { color:var(--link); text-decoration:underline; text-underline-offset:2px; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; border-radius:2px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
h1,h2,h3 { font-family:var(--display); color:var(--heading); margin:0; text-wrap:balance; }
.mono { font-family:var(--mono); }
.eyebrow { font-family:var(--mono); font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0; }
.num { font-variant-numeric:tabular-nums; }

/* ── Masthead ───────────────────────────────────── */
.mast { background:var(--band); color:var(--band-ink); padding-block:clamp(28px,5vw,56px) 28px; }
.brandbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px 28px; padding-bottom:18px; margin-bottom:20px; border-bottom:1px solid var(--band-line); }
.brandbar-logo { display:inline-flex; align-items:center; }
.brandbar-logo img { height:clamp(38px,4.4vw,52px); width:auto; display:block; background:#fff; padding:7px 10px; border-radius:9px; box-sizing:content-box; }
.brandbar-wordmark { font-family:var(--mono); font-size:.9rem; color:var(--band-ink); letter-spacing:.01em; }
.brandbar-wordmark b { color:var(--gold); font-weight:700; }
.brandbar-attr { margin:0; max-width:34em; font-size:clamp(.9rem,1.3vw,1.02rem); line-height:1.4; color:var(--band-muted); }
.brandbar-attr strong { color:var(--band-ink); font-weight:650; }
.mast .eyebrow { color:var(--band-muted); display:flex; flex-wrap:wrap; gap:.4rem 1.1rem; }
.mast .eyebrow span + span::before { content:""; display:inline-block; width:5px; height:5px; background:var(--gold); margin-right:1.1rem; transform:translateY(-2px) rotate(45deg); }
.mast-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:clamp(20px,4vw,56px); align-items:center; margin-top:1.4rem; }
.mast h1 { color:var(--band-ink); font-size:clamp(2.1rem,5.4vw,4.1rem); line-height:.98; font-weight:850; font-stretch:122%; letter-spacing:-.01em; }
.mast h1 em { font-style:normal; color:var(--gold); }
.thesis { font-size:clamp(1.05rem,1.8vw,1.28rem); line-height:1.45; color:var(--band-muted); max-width:34em; margin:1.1rem 0 0; }
.thesis strong { color:var(--band-ink); font-weight:650; }
.silhouette svg { width:100%; height:auto; display:block; }
.silhouette path { fill:var(--band-shape); stroke:var(--band); stroke-width:.9; transition:fill .2s; }
.silhouette path.hot { fill:var(--gold); }
.ladder { margin-top:clamp(24px,4vw,40px); border-top:1px solid var(--band-line); padding-top:14px; }
.ladder-head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:.3rem 1rem; align-items:baseline; }
.ladder-head .eyebrow { color:var(--band-muted); }
.readout { font-family:var(--mono); font-size:.85rem; color:var(--band-ink); min-height:1.4em; }
.readout b { color:var(--gold); font-weight:500; }
#ladder { display:block; width:100%; height:92px; cursor:crosshair; touch-action:pan-y; }
#ladder text { font-family:var(--mono); font-size:11px; fill:var(--band-muted); }
#ladder .end { fill:var(--band-ink); font-size:12px; }
#ladder .tick { stroke:var(--band-tick); stroke-width:2; opacity:.7; }
#ladder .tick.hot { stroke:var(--gold); opacity:1; stroke-width:3; }
#ladder .axis { stroke:var(--band-line); stroke-width:1; }
.stamp { margin-top:18px; font-family:var(--mono); font-size:.75rem; color:var(--band-muted); display:flex; flex-wrap:wrap; gap:.3rem 1.4rem; }

/* ── Sections ───────────────────────────────────── */
main section { padding-block:clamp(36px,6vw,64px) 0; }
.sec-head { display:grid; gap:.5rem; margin-bottom:1.4rem; max-width:44rem; }
.sec-head h2 { font-size:clamp(1.55rem,3vw,2.2rem); font-weight:800; font-stretch:112%; line-height:1.05; }
.sec-head p { margin:0; color:var(--ink-2); max-width:62ch; }

/* ── Atlas ──────────────────────────────────────── */
.atlas { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:0; background:var(--surface); border:1px solid var(--rule); border-radius:6px; overflow:hidden; }
.atlas-map { padding:clamp(14px,2.4vw,24px); border-right:1px solid var(--rule); min-width:0; }
.metric-tabs { display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--rule-strong); border-radius:4px; width:max-content; max-width:100%; overflow:hidden; }
.metric-tabs button { font:inherit; font-size:.85rem; font-weight:600; padding:.45rem .8rem; background:transparent; color:var(--ink-2); border:0; border-right:1px solid var(--rule-strong); cursor:pointer; }
.metric-tabs button:last-child { border-right:0; }
.metric-tabs button:hover { background:var(--hatch-bg); color:var(--ink); }
.metric-tabs button[aria-pressed="true"] { background:var(--heading); color:var(--surface); }
.map-meta { display:flex; flex-wrap:wrap; justify-content:space-between; gap:.4rem 1rem; margin:1rem 0 .3rem; align-items:baseline; }
.map-meta h3 { font-size:1.15rem; font-weight:750; font-stretch:105%; }
.map-meta .cov { font-family:var(--mono); font-size:.78rem; color:var(--muted); }
.map-box { position:relative; }
#map { display:block; width:100%; height:auto; }
#map .cty { stroke:var(--map-edge); stroke-width:.8; cursor:pointer; transition:fill .35s ease; }
#map .cty:hover { stroke:var(--sel-core); stroke-width:1.4; }
#map .na { fill:url(#hatch); }
#map .sel-halo { fill:none; stroke:var(--sel-halo); stroke-width:5; stroke-linejoin:round; pointer-events:none; }
#map .sel-core { fill:none; stroke:var(--sel-core); stroke-width:1.6; stroke-linejoin:round; pointer-events:none; }
#map .sel-label { font-family:var(--display); font-weight:750; font-size:15px; fill:var(--sel-core); paint-order:stroke; stroke:var(--map-edge); stroke-width:3.5px; pointer-events:none; }
.tip { position:absolute; pointer-events:none; background:var(--tip-bg); color:var(--tip-ink); padding:.45rem .6rem; border-radius:4px; font-size:.82rem; line-height:1.3; white-space:nowrap; transform:translate(-50%,calc(-100% - 12px)); z-index:3; }
.tip b { font-family:var(--display); font-weight:700; display:block; font-size:.9rem; }
.tip span { font-family:var(--mono); }
.legend { display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 20px; margin-top:.6rem; }
.ramp { position:relative; display:grid; grid-template-columns:repeat(7,1fr); width:min(100%,400px); padding-bottom:18px; }
.ramp i { display:block; height:12px; }
.ramp small { position:absolute; top:17px; transform:translateX(-50%); }
.ramp .edge { position:absolute; top:0; width:1px; height:16px; background:var(--rule-strong); }
.ramp small, .na-key small { font-family:var(--mono); font-size:.68rem; color:var(--muted); white-space:nowrap; }
.na-key { display:flex; flex-direction:column; gap:5px; padding-bottom:0; }
.na-key i { display:block; height:12px; width:40px; background:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,var(--hatch-bg) 1.5px 5px); border:1px solid var(--rule); }
.map-note { font-size:.8rem; color:var(--muted); margin:.8rem 0 0; max-width:62ch; }

.profile { padding:clamp(16px,2.4vw,26px); display:flex; flex-direction:column; gap:1.1rem; min-width:0; }
.picker label { display:block; }
.picker select { margin-top:.35rem; width:100%; font:inherit; font-size:.95rem; padding:.5rem .6rem; border:1px solid var(--rule-strong); border-radius:4px; background:var(--surface); color:var(--ink); }
.pname { display:flex; align-items:baseline; justify-content:space-between; gap:.6rem; flex-wrap:wrap; }
.pname h3 { font-size:clamp(1.8rem,3.2vw,2.5rem); font-weight:850; font-stretch:118%; line-height:1; }
.pname .mono { font-size:.78rem; color:var(--muted); }
.rank { margin:0; font-size:.95rem; color:var(--ink-2); }
.rank strong { color:var(--ink); }
.kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin:0; border-top:1px solid var(--rule); }
.kpis > div { padding:.8rem .6rem .8rem 0; border-bottom:1px solid var(--rule); min-width:0; }
.kpis > div:not(:nth-child(3n+1)) { padding-left:.8rem; border-left:1px solid var(--rule); }
.kpis dt { font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); line-height:1.25; min-height:2.5em; }
.kpis dd { margin:.25rem 0 0; font-family:var(--display); font-weight:750; font-stretch:105%; font-size:clamp(1.15rem,2vw,1.4rem); color:var(--heading); font-variant-numeric:tabular-nums; line-height:1.1; }
.kpis dd small { display:block; font-family:var(--mono); font-weight:400; font-size:.68rem; color:var(--muted); margin-top:.25rem; letter-spacing:0; }
.pos svg { display:block; width:100%; height:54px; }
.pos .eyebrow { margin-bottom:.3rem; }
.pos text { font-family:var(--mono); font-size:10.5px; fill:var(--muted); }
.pos .pt { stroke:var(--rule-strong); stroke-width:2; }
.pos .pt.me { stroke:var(--sel-core); stroke-width:3; }
.pos .me-halo { stroke:var(--gold); stroke-width:8; stroke-linecap:round; }
.pos .ax { stroke:var(--rule); }
.up { color:var(--pos) !important; } .down { color:var(--neg) !important; }
.dash { color:var(--muted) !important; font-weight:500 !important; }

/* ── County charts ──────────────────────────────── */
.charts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(14px,2vw,22px); }
.chart { margin:0; background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:18px 18px 14px; min-width:0; display:flex; flex-direction:column; }
.chart figcaption { display:grid; gap:.15rem; margin-bottom:.6rem; }
.chart figcaption b { font-family:var(--display); font-size:1.05rem; font-weight:750; font-stretch:105%; color:var(--heading); }
.chart figcaption span { font-size:.85rem; color:var(--ink-2); }
.plot { width:100%; min-height:220px; }
.plot svg { display:block; width:100%; }
.plot text { font-family:var(--mono); font-size:11px; fill:var(--muted); }
.plot .grid { stroke:var(--rule); stroke-width:1; }
.plot .base { stroke:var(--rule-strong); stroke-width:1; stroke-dasharray:3 3; }
.plot .ln { fill:none; stroke:var(--line); stroke-width:2.2; stroke-linejoin:round; }
.plot .ar { fill:var(--area); }
.plot .dot { fill:var(--line); stroke:var(--surface); stroke-width:2; }
.plot .lab { fill:var(--ink); font-weight:500; }
.plot .sf { fill:var(--sf); } .plot .mf { fill:var(--mf); }
.plot .bar { fill:var(--sf); }
.plot .inlab { fill:var(--surface); font-weight:500; }
.plot .rent { stroke:var(--gold-text); stroke-width:2; stroke-dasharray:5 4; }
.plot .rentlab { fill:var(--gold-text); font-weight:500; paint-order:stroke; stroke:var(--surface); stroke-width:3px; }
.empty { display:grid; place-items:center; min-height:220px; border:1px dashed var(--rule-strong); border-radius:4px; color:var(--muted); font-size:.9rem; text-align:center; padding:1rem; background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch-bg) 6px 7px); }
.key { display:flex; gap:1rem; font-size:.78rem; color:var(--ink-2); margin-top:.3rem; flex-wrap:wrap; }
.key i { display:inline-block; width:10px; height:10px; margin-right:.35rem; vertical-align:-1px; }
.src { font-size:.76rem; color:var(--muted); margin:.6rem 0 0; }
.src a { color:var(--muted); }
details.dt { margin-top:.5rem; font-size:.8rem; }
details.dt summary { cursor:pointer; color:var(--link); font-weight:600; width:max-content; }
.tscroll { overflow-x:auto; max-height:260px; margin-top:.4rem; }
.tscroll table { border-collapse:collapse; font-family:var(--mono); font-size:.75rem; }
.tscroll th, .tscroll td { padding:.2rem .7rem .2rem 0; text-align:right; border-bottom:1px solid var(--rule); white-space:nowrap; }
.tscroll th:first-child, .tscroll td:first-child { text-align:left; }

/* ── Construction ───────────────────────────────── */
.build { display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr); gap:clamp(20px,4vw,48px); align-items:start; }
.bigfig { font-family:var(--display); font-weight:900; font-stretch:125%; font-size:clamp(3.4rem,8vw,6rem); line-height:.9; color:var(--heading); letter-spacing:-.02em; }
.bigfig-cap { margin:.6rem 0 0; color:var(--ink-2); max-width:30ch; font-size:1.05rem; }
.bigfig-cap strong { color:var(--ink); }
.bars { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:18px; }
.bars-head { display:flex; justify-content:space-between; flex-wrap:wrap; gap:.4rem 1rem; align-items:baseline; margin-bottom:.8rem; }
.bars-head b { font-family:var(--display); font-weight:750; font-stretch:105%; color:var(--heading); }
.brow { display:grid; grid-template-columns:7.5rem minmax(0,1fr) 3.6rem; gap:.7rem; align-items:center; padding:.22rem 0; font-size:.88rem; cursor:pointer; border-radius:3px; }
.brow:hover { background:var(--hatch-bg); }
.brow.is-sel .bname { font-weight:700; color:var(--ink); }
.brow.is-sel .bname::after { content:" ◆"; color:var(--gold-text); font-size:.7em; }
.bname { color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.btrack { display:flex; height:14px; }
.btrack i { display:block; height:100%; min-width:1px; }
.btrack .sf { background:var(--sf); } .btrack .mf { background:var(--mf); }
.bval { font-family:var(--mono); font-size:.8rem; text-align:right; font-variant-numeric:tabular-nums; }
.more { margin-top:.8rem; font:inherit; font-size:.85rem; font-weight:600; background:transparent; color:var(--link); border:1px solid var(--rule-strong); border-radius:4px; padding:.4rem .8rem; cursor:pointer; }
.more:hover { border-color:var(--link); }

/* ── Table ──────────────────────────────────────── */
.tablebox { background:var(--surface); border:1px solid var(--rule); border-radius:6px; overflow:auto; max-height:560px; }
table.all { border-collapse:collapse; width:100%; font-size:.86rem; }
table.all caption { text-align:left; padding:.8rem 1rem; color:var(--muted); font-size:.8rem; }
table.all th, table.all td { padding:.5rem .9rem; border-bottom:1px solid var(--rule); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
table.all td:first-child, table.all th:first-child { text-align:left; }
table.all thead th { position:sticky; top:0; background:var(--surface); z-index:1; box-shadow:inset 0 -2px 0 var(--heading); font-weight:600; }
table.all thead button { font:inherit; font-size:.76rem; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
table.all thead button::after { content:"↕"; margin-left:.3rem; color:var(--rule-strong); }
table.all th[aria-sort="ascending"] button::after { content:"↑"; color:var(--ink); }
table.all th[aria-sort="descending"] button::after { content:"↓"; color:var(--ink); }
table.all tbody tr { cursor:pointer; }
table.all tbody tr:hover { background:var(--hatch-bg); }
table.all tbody tr.is-sel { background:color-mix(in srgb, var(--gold) 16%, var(--surface)); }
table.all .fips { font-family:var(--mono); font-size:.78rem; color:var(--muted); }
table.all td.m { color:var(--muted); }

footer { margin-top:clamp(48px,7vw,80px); border-top:1px solid var(--rule); padding-block:28px 48px; }
.foot { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; font-size:.84rem; color:var(--ink-2); }
.foot h3 { font-size:.95rem; font-weight:750; margin-bottom:.4rem; }
.foot p, .foot ul { margin:0; } .foot ul { padding-left:1.1rem; }

@media (max-width: 960px) {
  .atlas { grid-template-columns:1fr; } .atlas-map { border-right:0; border-bottom:1px solid var(--rule); }
  .build { grid-template-columns:1fr; }
}
@media (max-width: 760px) {
  .mast-grid { grid-template-columns:1fr; } .silhouette { max-width:340px; }
  .charts { grid-template-columns:1fr; } .foot { grid-template-columns:1fr; }
  .brow { grid-template-columns:6.2rem minmax(0,1fr) 3.2rem; }
}
@media (max-width: 460px) {
  .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .kpis > div:not(:nth-child(3n+1)) { padding-left:0; border-left:0; }
  .kpis > div:nth-child(2n) { padding-left:.8rem; border-left:1px solid var(--rule); }
  .metric-tabs button { font-size:.78rem; padding:.4rem .55rem; }
}
@keyframes rise { from { transform:scaleY(.2); } to { transform:scaleY(1); } }
#ladder .tick { transform-box:fill-box; transform-origin:bottom; animation:rise .6s cubic-bezier(.2,.8,.2,1) both; }
@media (prefers-reduced-motion: reduce) { #ladder .tick { animation:none; } #map .cty { transition:none; } }

.embed{max-width:1000px;} .kpis{border-top:1px solid var(--rule);}
</style>
</head>
<body>
<main class="wrap embed"><h1 class="sr-only">Jefferson County real estate detail</h1><div class="sec-head" style="margin-top:1.4rem"><p class="eyebrow">County trends</p><h2>Jefferson County</h2><p class="mono" style="color:var(--muted)">FIPS 54037</p></div><dl class="kpis" id="kpis" style="margin-bottom:1.8rem"></dl>
<div class="charts">
  <figure class="chart"><figcaption><b>House price index</b><span>Repeat-sales index, 2000 = 100. Tracks change, not dollar level.</span></figcaption>
    <div class="plot" id="c-hpi" role="img"></div><div id="d-hpi"></div>
    <p class="src">Source: <a href="https://www.fhfa.gov/data/hpi">FHFA House Price Index</a>, annual</p></figure>
  <figure class="chart"><figcaption><b>Median listing price</b><span>Monthly asking price, Realtor.com. Published for 12 larger counties.</span></figcaption>
    <div class="plot" id="c-lp" role="img"></div><div id="d-lp"></div>
    <p class="src">Source: <a href="https://fred.stlouisfed.org">Realtor.com via FRED</a>, monthly</p></figure>
  <figure class="chart"><figcaption><b>Homes authorized by permit</b><span>New residential units per year, single-family vs. multifamily.</span></figcaption>
    <div class="plot" id="c-perm" role="img"></div>
    <div class="key"><span><i style="background:var(--sf)"></i>Single-family</span><span><i style="background:var(--mf)"></i>Multifamily (2+ units)</span></div>
    <div id="d-perm"></div>
    <p class="src">Source: <a href="https://www.census.gov/construction/bps">Census Building Permits Survey</a>. Authorized, not necessarily built.</p></figure>
  <figure class="chart"><figcaption><b>Fair Market Rent by bedroom</b><span>HUD benchmark (about the 40th percentile of local rents), FY2026.</span></figcaption>
    <div class="plot" id="c-fmr" role="img"></div><div id="d-fmr"></div>
    <p class="src">Source: <a href="https://www.huduser.gov/portal/datasets/fmr.html">HUD Fair Market Rents</a>. Dashed line: ACS median gross rent.</p></figure>
</div>
</main><script>
const EC = {"f": "54037", "n": "Jefferson", "c": [768.9, 279.5], "hv": 350800.0, "ppsf": 197.0, "g": 12.27, "pt": 1324, "psf": 1213, "rent": 1108.0, "own": 80.27100508682688, "vac": 7.951885040768547, "built": 1991, "dom": 43.0, "hpi": [[1989, 75.6], [1990, 83.9], [1991, 79.4], [1992, 83.3], [1993, 84.9], [1994, 86.5], [1995, 85.6], [1996, 88.7], [1997, 87.6], [1998, 92.3], [1999, 94.8], [2000, 100.0], [2001, 106.9], [2002, 116.0], [2003, 123.4], [2004, 145.6], [2005, 175.3], [2006, 194.4], [2007, 186.1], [2008, 165.8], [2009, 142.2], [2010, 129.3], [2011, 125.8], [2012, 122.8], [2013, 128.0], [2014, 138.6], [2015, 142.1], [2016, 142.7], [2017, 145.9], [2018, 155.3], [2019, 161.8], [2020, 167.6], [2021, 187.4], [2022, 212.2], [2023, 238.3]], "lps": [["2016-07", 278900.0], ["2016-08", 279475.0], ["2016-09", 278350.0], ["2016-10", 267700.0], ["2016-11", 258200.0], ["2016-12", 249000.0], ["2017-01", 249450.0], ["2017-02", 249990.0], ["2017-03", 254998.0], ["2017-04", 267990.0], ["2017-05", 299950.0], ["2017-06", 299950.0], ["2017-07", 297990.0], ["2017-08", 299900.0], ["2017-09", 294990.0], ["2017-10", 299450.0], ["2017-11", 289900.0], ["2017-12", 289995.0], ["2018-01", 283698.0], ["2018-02", 299900.0], ["2018-03", 294445.0], ["2018-04", 298573.0], ["2018-05", 305220.0], ["2018-06", 307945.0], ["2018-07", 299675.0], ["2018-08", 299573.0], ["2018-09", 305000.0], ["2018-10", 301200.0], ["2018-11", 298868.0], ["2018-12", 299000.0], ["2019-01", 295373.0], ["2019-02", 294975.0], ["2019-03", 296962.0], ["2019-04", 292123.0], ["2019-05", 300945.0], ["2019-06", 300000.0], ["2019-07", 299900.0], ["2019-08", 296115.0], ["2019-09", 298244.0], ["2019-10", 299900.0], ["2019-11", 309990.0], ["2019-12", 300000.0], ["2020-01", 302345.0], ["2020-02", 309900.0], ["2020-03", 310445.0], ["2020-04", 310248.0], ["2020-05", 299500.0], ["2020-06", 307288.0], ["2020-07", 319718.0], ["2020-08", 334500.0], ["2020-09", 334950.0], ["2020-10", 319950.0], ["2020-11", 379900.0], ["2020-12", 336225.0], ["2021-01", 325000.0], ["2021-02", 320000.0], ["2021-03", 332225.0], ["2021-04", 377225.0], ["2021-05", 375000.0], ["2021-06", 356338.0], ["2021-07", 354740.0], ["2021-08", 339498.0], ["2021-09", 370995.0], ["2021-10", 382000.0], ["2021-11", 380000.0], ["2021-12", 394000.0], ["2022-01", 393500.0], ["2022-02", 402673.0], ["2022-03", 399423.0], ["2022-04", 418000.0], ["2022-05", 431973.0], ["2022-06", 418700.0], ["2022-07", 399995.0], ["2022-08", 404995.0], ["2022-09", 399450.0], ["2022-10", 404995.0], ["2022-11", 402492.0], ["2022-12", 399000.0], ["2023-01", 399999.0], ["2023-02", 404995.0], ["2023-03", 416495.0], ["2023-04", 419990.0], ["2023-05", 424995.0], ["2023-06", 431247.0], ["2023-07", 425000.0], ["2023-08", 429990.0], ["2023-09", 415000.0], ["2023-10", 415248.0], ["2023-11", 417400.0], ["2023-12", 419900.0], ["2024-01", 419998.0], ["2024-02", 412990.0], ["2024-03", 414990.0], ["2024-04", 413941.0], ["2024-05", 421468.0], ["2024-06", 408191.0], ["2024-07", 427000.0], ["2024-08", 411382.0], ["2024-09", 401113.0], ["2024-10", 415250.0], ["2024-11", 419740.0], ["2024-12", 408495.0], ["2025-01", 427745.0], ["2025-02", 422473.0], ["2025-03", 418995.0], ["2025-04", 432473.0], ["2025-05", 432500.0], ["2025-06", 439993.0], ["2025-07", 437270.0], ["2025-08", 439900.0], ["2025-09", 424379.0], ["2025-10", 416445.0], ["2025-11", 414000.0], ["2025-12", 397247.0], ["2026-01", 412290.0], ["2026-02", 427490.0], ["2026-03", 423747.0], ["2026-04", 419990.0], ["2026-05", 439900.0], ["2026-06", 439825.0], ["2026-07", 434950.0], ["2026-08", 429450.0]], "perm": [[2000, 434, 49], [2001, 467, 67], [2002, 674, 4], [2003, 800, 10], [2004, 540, 0], [2005, 527, 0], [2006, 547, 7], [2007, 487, 302], [2008, 219, 0], [2009, 173, 0], [2010, 159, 0], [2011, 135, 0], [2012, 136, 0], [2013, 230, 6], [2014, 200, 0], [2015, 204, 100], [2016, 159, 0], [2017, 274, 0], [2018, 207, 10], [2019, 197, 0], [2020, 250, 38], [2021, 392, 297], [2022, 269, 259], [2023, 557, 450], [2024, 776, 214], [2025, 1213, 111]], "fmr": [947.0, 953.0, 1251.0, 1740.0, 2099.0]};
const M = {acsYear: 2024, fmrYear: 2026};

const $ = id => document.getElementById(id);
const money = v => v == null ? '—' : '$' + Math.round(v).toLocaleString('en-US');
const kMoney = v => '$' + (v >= 1000 ? Math.round(v / 1000) + 'k' : v);
const pct = v => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%';
const int = v => v == null ? '—' : Math.round(v).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ym = s => MON[+s.slice(5) - 1] + ' ' + s.slice(0, 4);

function niceTicks(lo, hi, n) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const t = [], end = Math.ceil(hi / step - 1e-9) * step; for (let v = Math.floor(lo / step + 1e-9) * step; v <= end + 1e-9; v += step) t.push(+v.toFixed(6));
  return t;
}
function frame(el, h) { const w = Math.max(el.clientWidth, 260); return { w, h, svg: s => `<svg viewBox="0 0 ${w} ${h}" height="${h}">${s}</svg>` }; }
function table(id, head, rows) {
  $(id).innerHTML = `<details class="dt"><summary>Data table</summary><div class="tscroll"><table><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}
function empty(el, msg) { el.innerHTML = `<div class="empty">${msg}</div>`; }
function lineChart(el, pts, { yFmt, xTicks, xLab, base, endFmt }) {
  const F = frame(el, 230), L = 48, R = 14, T = 16, B = 26;
  const ys = pts.map(p => p[1]), lo0 = Math.min(...ys, base ?? Infinity), hi0 = Math.max(...ys, base ?? -Infinity);
  const yt = niceTicks(lo0, hi0 + (hi0 - lo0) * .06, 4);
  const y0 = yt[0], y1 = yt[yt.length - 1], x0 = pts[0][0], x1 = pts[pts.length - 1][0];
  const X = v => L + (v - x0) / (x1 - x0) * (F.w - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (F.h - T - B);
  let s = yt.map(v => `<line class="grid" x1="${L}" x2="${F.w - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`).join('');
  s += xTicks.map(v => `<text x="${X(v)}" y="${F.h - 6}" text-anchor="middle">${xLab(v)}</text>`).join('');
  if (base != null) s += `<line class="base" x1="${L}" x2="${F.w - R}" y1="${Y(base)}" y2="${Y(base)}"/>`;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('');
  s += `<path class="ar" d="${d}L${X(x1)},${Y(y0)}L${X(x0)},${Y(y0)}Z"/><path class="ln" d="${d}"/>`;
  const e = pts[pts.length - 1];
  s += `<circle class="dot" cx="${X(e[0])}" cy="${Y(e[1])}" r="4.5"/><text class="lab" x="${X(e[0]) - 8}" y="${Y(e[1]) - 10}" text-anchor="end">${endFmt(e[1])}</text>`;
  el.innerHTML = F.svg(s);
}

function kpi(c) {
  const lpLast = c.lps.length ? c.lps[c.lps.length - 1][0] : null;
  const g = c.g == null ? '<span class="dash">—</span>' : `<span class="${c.g >= 0 ? 'up' : 'down'}">${c.g >= 0 ? '▲' : '▼'} ${pct(c.g)}</span>`;
  const kp = [
    ['Median home value', money(c.hv), `ACS ${M.acsYear}`],
    ['Price per sq ft', c.ppsf == null ? '<span class="dash">—</span>' : '$' + Math.round(c.ppsf), c.ppsf == null ? 'not published' : (lpLast ? ym(lpLast) : '')],
    ['Price growth', g, 'FHFA 2023'],
    ['Median gross rent', money(c.rent), `ACS ${M.acsYear}`],
    ['Owner-occupied', c.own == null ? '—' : c.own.toFixed(1) + '%', 'of occupied homes'],
    ['Units authorized', c.pt == null ? '<span class="dash">—</span>' : int(c.pt), c.pt == null ? 'no 2025 report' : '2025 permits'],
    ['Vacancy rate', c.vac == null ? '—' : c.vac.toFixed(1) + '%', 'of all units'],
    ['Median year built', c.built == null ? '—' : c.built, 'housing stock'],
    ['Days on market', c.dom == null ? '<span class="dash">—</span>' : int(c.dom), c.dom == null ? 'not published' : (lpLast ? ym(lpLast) : '')],
  ];
  $('kpis').innerHTML = kp.map(([l, v, s]) => `<div><dt>${l}</dt><dd>${v}<small>${s}</small></dd></div>`).join('');
}

function chartsFor(c) {
  const lpLast = c.lps.length ? c.lps[c.lps.length - 1][0] : null;
  // HPI
  const eh = $('c-hpi');
  if (c.hpi.length > 2) {
    const first = c.hpi[0][0], last = c.hpi[c.hpi.length - 1][0];
    const xt = []; for (let y = Math.ceil(first / 5) * 5; y <= last; y += 5) xt.push(y);
    lineChart(eh, c.hpi, { yFmt: v => v, xTicks: xt, xLab: v => v, base: 100, endFmt: v => `${last}: ${v.toFixed(0)}` });
    eh.setAttribute('aria-label', `Line chart: ${c.n} County house price index rose from 100 in 2000 to ${c.hpi[c.hpi.length - 1][1].toFixed(0)} in ${last}.`);
    table('d-hpi', ['Year', 'Index (2000 = 100)'], c.hpi.slice().reverse().map(r => [r[0], r[1].toFixed(1)]));
  } else { empty(eh, `FHFA does not publish a county index for ${esc(c.n)} County.`); eh.setAttribute('aria-label', 'No data'); $('d-hpi').innerHTML = ''; }
  // Listing price
  const el = $('c-lp');
  if (c.lps.length) {
    const pts = c.lps.filter(p => p[1] != null).map(p => [+p[0].slice(0, 4) + (+p[0].slice(5) - 1) / 12, p[1]]);
    const xt = []; for (let y = Math.ceil(pts[0][0]); y <= pts[pts.length - 1][0]; y += (el.clientWidth < 420 ? 3 : 2)) xt.push(y);
    lineChart(el, pts, { yFmt: kMoney, xTicks: xt, xLab: v => v, endFmt: v => `${ym(lpLast)}: ${money(v)}` });
    el.setAttribute('aria-label', `Line chart: ${c.n} County median listing price by month, latest ${money(pts[pts.length - 1][1])}.`);
    table('d-lp', ['Month', 'Median listing price'], c.lps.slice().reverse().map(r => [ym(r[0]), money(r[1])]));
  } else { empty(el, `Realtor.com publishes no listing series for ${esc(c.n)} County. Coverage is limited to the 12 counties with the most listings.`); el.setAttribute('aria-label', 'No data'); $('d-lp').innerHTML = ''; }
  // Permits
  const ep = $('c-perm'), P = c.perm;
  if (P.length) {
    const F = frame(ep, 230), L = 44, R = 8, T = 14, B = 26, mx = Math.max(...P.map(r => r[1] + r[2]), 4);
    const yt = niceTicks(0, mx * 1.05, 4), y1 = yt[yt.length - 1], n = P.length, bw = (F.w - L - R) / n;
    const X = i => L + i * bw, Y = v => T + (1 - v / y1) * (F.h - T - B);
    let s = yt.map(v => `<line class="grid" x1="${L}" x2="${F.w - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${int(v)}</text>`).join('');
    P.forEach((r, i) => {
      const g = Math.max(bw * .22, 1), x = X(i) + g / 2, w = bw - g;
      s += `<rect class="sf" x="${x}" width="${w}" y="${Y(r[1])}" height="${Y(0) - Y(r[1])}"/>`;
      if (r[2]) s += `<rect class="mf" x="${x}" width="${w}" y="${Y(r[1] + r[2])}" height="${Y(r[1]) - Y(r[1] + r[2])}"/>`;
      if (r[0] % 5 === 0) s += `<text x="${X(i) + bw / 2}" y="${F.h - 6}" text-anchor="middle">${r[0]}</text>`;
    });
    ep.innerHTML = F.svg(s);
    ep.setAttribute('aria-label', `Stacked bar chart of residential units authorized in ${c.n} County, ${P[0][0]} to ${P[n - 1][0]}.`);
    table('d-perm', ['Year', 'Single-family', 'Multifamily', 'Total'], P.slice().reverse().map(r => [r[0], int(r[1]), int(r[2]), int(r[1] + r[2])]));
  } else { empty(ep, `No building-permit series for ${esc(c.n)} County.`); ep.setAttribute('aria-label', 'No data'); $('d-perm').innerHTML = ''; }
  // FMR
  const ef = $('c-fmr');
  if (c.fmr.length) {
    const F = frame(ef, 230), L = 44, R = 8, T = 22, B = 26, labs = ['Studio', '1 BR', '2 BR', '3 BR', '4 BR'];
    const mx = Math.max(...c.fmr, c.rent || 0), yt = niceTicks(0, mx * 1.12, 4), y1 = yt[yt.length - 1], bw = (F.w - L - R) / 5;
    const Y = v => T + (1 - v / y1) * (F.h - T - B);
    let s = yt.map(v => `<line class="grid" x1="${L}" x2="${F.w - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${kMoney(v).replace(/^\$0k$/, '$0')}</text>`).join('');
    c.fmr.forEach((v, i) => {
      const x = L + i * bw + bw * .16, w = bw * .68;
      s += `<rect class="bar" x="${x}" width="${w}" y="${Y(v)}" height="${Y(0) - Y(v)}"/><text class="inlab" x="${x + w / 2}" y="${Y(v) + 16}" text-anchor="middle">${money(v)}</text>`;
      s += `<text x="${x + w / 2}" y="${F.h - 6}" text-anchor="middle">${labs[i]}</text>`;
    });
    if (c.rent) s += `<line class="rent" x1="${L}" x2="${F.w - R}" y1="${Y(c.rent)}" y2="${Y(c.rent)}"/><text class="rentlab" x="${L + 4}" y="${Y(c.rent) - 6}">ACS median ${money(c.rent)}</text>`;
    ef.innerHTML = F.svg(s);
    ef.setAttribute('aria-label', `Bar chart of HUD Fair Market Rents in ${c.n} County: ${c.fmr.map((v, i) => labs[i] + ' ' + money(v)).join(', ')}.`);
    table('d-fmr', ['Unit', 'Fair Market Rent'], c.fmr.map((v, i) => [labs[i], money(v)]).concat([['ACS median gross rent', money(c.rent)]]));
  } else { empty(ef, `No HUD Fair Market Rents for ${esc(c.n)} County.`); ef.setAttribute('aria-label', 'No data'); $('d-fmr').innerHTML = ''; }
}

kpi(EC); chartsFor(EC);
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => chartsFor(EC), 120); }).observe(document.body);

</script>
