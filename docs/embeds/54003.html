  window.addEventListener('resize', postHeight);
  setTimeout(postHeight, 800);
  setTimeout(postHeight, 1600);
  document.querySelectorAll('.plotly-chart').forEach(function(el) {
    el.on && el.on('plotly_afterplot', postHeight);
  });
})();

</script>
